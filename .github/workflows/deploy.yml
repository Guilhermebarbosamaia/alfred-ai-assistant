name: Deploy Alfred na Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cloudflare/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # botão "Run workflow" na aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        # O projeto do Worker (pyproject.toml, wrangler.toml) fica em cloudflare/
        working-directory: cloudflare
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Node.js (necessário para o wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # O [build] do wrangler.toml roda copiar_codigo.py, que copia ../src para worker/src
      - name: Deploy na Cloudflare
        run: uv run pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
