[project]
name = "alfred-cloudflare"
version = "0.1.0"
description = "Alfred rodando como Python Worker na Cloudflare"
requires-python = ">=3.12"
# Só o necessário para a nuvem: sem ollama, APScheduler nem python-telegram-bot.
dependencies = [
    "anthropic>=1.17,<2",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    # Base de fusos horários para o zoneinfo (o Pyodide não tem a do sistema).
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["workers-py>=1.17,<2"]
